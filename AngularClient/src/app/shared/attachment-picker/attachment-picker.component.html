<div class="attachment-picker">
  <div class="custom-file mb-2">
    <input type="file" class="form-control" multiple [accept]="acceptAttribute" (change)="onFileSelected($event)">
  </div>

  <ul class="list-group" *ngIf="files.length">
    <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let file of files; let i = index">
      <span>
        <i class="fa fa-paperclip mr-1"></i>
        {{ file.name }}
        <small class="text-muted">({{ formatSize(file.size) }})</small>
      </span>
      <span>
        <i class="fa fa-eye text-primary mr-2" *ngIf="isViewableInline(file)" (click)="viewFile(file)" title="View" role="button"></i>
        <i class="fa fa-times text-danger" (click)="removeFile(i)" title="Remove" role="button"></i>
      </span>
    </li>
  </ul>
</div>
